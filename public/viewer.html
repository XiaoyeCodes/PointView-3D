// 路径 2：STEP / STP（用 occt-import-js / OpenCascade WASM 原生解析）
// ==================================================================
async function mainStep() {
  try {
    setLoadingText('正在加载几何内核…');
    const occt = await occtimportjs({
      locateFile: (path) => '/vendor/' + path,
    });

    setLoadingText('正在下载 STEP 文件…');
    const buffer = await fetch(modelUrl).then(r => {
      if (!r.ok) throw new Error('无法读取 STEP 文件 (HTTP ' + r.status + ')');
      return r.arrayBuffer();
    });

    setLoadingText('正在解析几何（B-rep 精确曲面）…');
    const result = occt.ReadStepFile(new Uint8Array(buffer), null);

    if (!result.success || !result.meshes || result.meshes.length === 0) {
      showError('STEP 文件解析失败，请确认文件是否损坏，或尝试用 CAD 软件另存一次。');
      return;
    }

    renderStep(result);
  } catch (err) {
    console.error(err);
    showError('加载或解析 STEP 模型时出错：\n' + err.message);
  }
}

// 当前内置的 occt-import-js 会把 STEP 中的 sRGB 颜色转换成线性 RGB 后输出。
// Three.js r128 的 Color 在这里按显示值使用，因此要转回 sRGB，才能还原
// STEP 文件里的 COLOUR_RGB 数值。比如本测试模型的 Pale Tan 会从解析结果
// (0.651, 0.509, 0.407) 恢复成文件中声明的 (0.827, 0.741, 0.671)。
function stepColorToThree(color, fallback) {
  if (!color) return fallback ? fallback.clone() : new THREE.Color(0x9aa4b2);
  return new THREE.Color(color[0], color[1], color[2]).convertLinearToSRGB();
}

function stepColorKey(color) {
  return color.map(value => value.toFixed(6)).join(',');
}

// 参考 occt-import-js 官方数据结构：按 brep_faces 把三角形分组，
// 每组对应一个真实的 CAD 曲面 —— 分组着色 + 分组求边界，
// EdgesGeometry 的阈值给到 180 度，意味着"只保留组内不共享的边"，
// 也就是该曲面自身的边界，组内三角化产生的内部线全部被过滤掉。
function buildStepMesh(geometryMesh) {
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(geometryMesh.attributes.position.array, 3));
  if (geometryMesh.attributes.normal) {
    geometry.setAttribute('normal', new THREE.Float32BufferAttribute(geometryMesh.attributes.normal.array, 3));
  } else {
    geometry.computeVertexNormals();
  }
  const index = Uint32Array.from(geometryMesh.index.array);
  geometry.setIndex(new THREE.BufferAttribute(index, 1));

  const defaultColor = stepColorToThree(geometryMesh.color);
  const defaultMaterial = new THREE.MeshPhongMaterial({ color: defaultColor, shininess: 25, side: THREE.DoubleSide });

  const outlineMaterial = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.6 });
  const edgesGroup = new THREE.Group();

  const materials = [defaultMaterial];
  const materialIndexByColor = new Map();
  const faceMaterialIndices = [];
  geometry.userData.brepFaces = [];

  if (geometryMesh.brep_faces && geometryMesh.brep_faces.length > 0) {
    geometryMesh.brep_faces.forEach(f => {
      if (!f.color) {
        faceMaterialIndices.push(0);
        return;
      }
      const key = stepColorKey(f.color);
      if (!materialIndexByColor.has(key)) {
        const color = stepColorToThree(f.color, defaultColor);
        materials.push(new THREE.MeshPhongMaterial({ color, shininess: 25, side: THREE.DoubleSide }));
        materialIndexByColor.set(key, materials.length - 1);
      }
      faceMaterialIndices.push(materialIndexByColor.get(key));
    });

    geometry.userData.brepFaces = geometryMesh.brep_faces.map((face, index) => ({
      first: face.first,
      last: face.last,
      number: index + 1,
      materialIndex: faceMaterialIndices[index]
    }));

    const triangleCount = index.length / 3;
    let triangleIndex = 0;
    let faceGroupIndex = 0;

    while (triangleIndex < triangleCount) {
      let lastIndex, materialIndex;
      if (faceGroupIndex >= geometryMesh.brep_faces.length) {
        lastIndex = triangleCount;
        materialIndex = 0;
      } else if (triangleIndex < geometryMesh.brep_faces[faceGroupIndex].first) {
        lastIndex = geometryMesh.brep_faces[faceGroupIndex].first;
        materialIndex = 0;
      } else {
        lastIndex = geometryMesh.brep_faces[faceGroupIndex].last + 1;
        materialIndex = faceMaterialIndices[faceGroupIndex];
        faceGroupIndex++;
      }
      const firstIndex = triangleIndex;
      geometry.addGroup(firstIndex * 3, (lastIndex - firstIndex) * 3, materialIndex);
      triangleIndex = lastIndex;

      // 每个曲面分组单独求边界，避免跨曲面/曲面内部的三角化线条混进来
      const innerGeo = new THREE.BufferGeometry();
      innerGeo.setAttribute('position', geometry.attributes.position);
      if (geometry.attributes.normal) innerGeo.setAttribute('normal', geometry.attributes.normal);
      innerGeo.setIndex(new THREE.BufferAttribute(index.slice(firstIndex * 3, lastIndex * 3), 1));
      const innerEdges = new THREE.EdgesGeometry(innerGeo, 180);
      edgesGroup.add(new THREE.LineSegments(innerEdges, outlineMaterial));
    }
  } else {
    // 没有 brep_faces 分组信息时，退化为整体角度阈值过滤
    const edgesGeo = new THREE.EdgesGeometry(geometry, 20);
    edgesGroup.add(new THREE.LineSegments(edgesGeo, outlineMaterial));
  }

  const mesh = new THREE.Mesh(geometry, materials.length > 1 ? materials : materials[0]);
  return { mesh, edges: edgesGroup };
}

// 有些 STEP 文件（常见于从装配体里整体导出）会包含彼此完全重叠的
// 重复实体——比如同一个零件被多导出了一份，其中一份带正确的颜色信息，
// 另一份是没有颜色的"影子"。如果两个都画出来，会发生 z-fighting
// （深度冲突），表现为闪烁的噪点，还会把正确的颜色遮住。
// 这里按包围盒是否基本重合来分组，每组只保留"颜色信息最丰富"的一个。
function computeBoundingBox(geometryMesh) {
  const pos = geometryMesh.attributes.position.array;
  const min = [Infinity, Infinity, Infinity];
  const max = [-Infinity, -Infinity, -Infinity];
  for (let i = 0; i < pos.length; i += 3) {
    for (let k = 0; k < 3; k++) {
      if (pos[i + k] < min[k]) min[k] = pos[i + k];
      if (pos[i + k] > max[k]) max[k] = pos[i + k];
    }
  }
  return { min, max };
}

function bboxCloseEnough(a, b) {
  const size = [0, 1, 2].map(k => Math.max(a.max[k] - a.min[k], b.max[k] - b.min[k], 1e-6));
  const diag = Math.hypot(size[0], size[1], size[2]);
  const tol = Math.max(diag * 0.01, 1e-4); // 允许 1% 对角线长度的误差
  for (let k = 0; k < 3; k++) {
    if (Math.abs(a.min[k] - b.min[k]) > tol) return false;
    if (Math.abs(a.max[k] - b.max[k]) > tol) return false;
  }
  return true;
}

function coloredFaceCount(geometryMesh) {
  return (geometryMesh.brep_faces || []).filter(f => f.color).length;
}

function getStepColorStats(meshes) {
  const colors = new Set();
  let coloredFaces = 0;
  meshes.forEach(mesh => {
    if (mesh.color) colors.add(stepColorKey(mesh.color));
    (mesh.brep_faces || []).forEach(face => {
      if (!face.color) return;
      colors.add(stepColorKey(face.color));
      coloredFaces++;
    });
  });
  return { colorCount: colors.size, coloredFaces };
}

function dedupeOverlappingMeshes(meshes) {
  const withBox = meshes.map(m => ({ mesh: m, box: computeBoundingBox(m) }));
  const used = new Array(withBox.length).fill(false);
  const clusters = [];

  for (let i = 0; i < withBox.length; i++) {
    if (used[i]) continue;
    const cluster = [i];
    used[i] = true;
    for (let j = i + 1; j < withBox.length; j++) {
      if (!used[j] && bboxCloseEnough(withBox[i].box, withBox[j].box)) {
        cluster.push(j);
        used[j] = true;
      }
    }
    clusters.push(cluster);
  }

  const kept = [];
  let skippedCount = 0;
  clusters.forEach(cluster => {
    if (cluster.length === 1) {
      kept.push(withBox[cluster[0]].mesh);
      return;
    }
    // 重叠的一组里，优先选颜色信息最丰富（着色面最多）的那个；
    // 打平的话再比较 mesh 自身是否带颜色。
    let best = cluster[0];
    cluster.forEach(idx => {
      const bestColored = coloredFaceCount(withBox[best].mesh);
      const curColored = coloredFaceCount(withBox[idx].mesh);
      if (curColored > bestColored) {
        best = idx;
      } else if (curColored === bestColored && withBox[idx].mesh.color && !withBox[best].mesh.color) {
        best = idx;
      }
    });
    kept.push(withBox[best].mesh);
    skippedCount += cluster.length - 1;
  });

  return { kept, skippedCount };
}

function renderStep(result) {
  const { scene, camera, renderer } = createSceneBasics();
  const group = new THREE.Group();

  const { kept, skippedCount } = dedupeOverlappingMeshes(result.meshes);
  const colorStats = getStepColorStats(kept);

  kept.forEach(geometryMesh => {
    const { mesh, edges } = buildStepMesh(geometryMesh);
    group.add(mesh);
    group.add(edges);
  });

  if (skippedCount > 0) {
    infoEl.innerHTML += `<br><span style="opacity:0.6">已自动跳过 ${skippedCount} 个与其他实体完全重叠的重复几何体（避免颜色错乱/闪烁）</span>`;
  }
  if (colorStats.colorCount > 0) {
    infoEl.innerHTML += `<br><span style="opacity:0.6">已读取 STEP 原始颜色：${colorStats.colorCount} 种可见颜色，${colorStats.coloredFaces} 个独立着色面</span>`;
  }

  // STEP/CAD 数据一般是 Z 轴朝上，这里转换成 three.js 习惯的 Y 轴朝上
  group.rotation.x = -Math.PI / 2;

  scene.add(group);
  const controlsState = fitCameraAndControls(scene, camera, renderer, group);
  const originMarker = addOriginMarker(group);
  const toolbarState = setupToolbar({ scene, camera, renderer, group, grid: controlsState.grid, originMarker });
  setupViewShortcuts({ camera, group, controlsState });
  const renderGizmo = setupAxisGizmo(camera, group);
  loadingEl.style.display = 'none';
  startRenderLoop(renderer, scene, camera, controlsState, toolbarState.updateAnnotations, renderGizmo);
}
</script>
